<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deadman</title>
  <style>
    :root{
      --bg:#0b0c10;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:
        radial-gradient(1200px 700px at 15% 0%, rgba(255,255,255,.08), transparent),
        radial-gradient(900px 600px at 85% 10%, rgba(255,255,255,.06), transparent),
        var(--bg);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(0,0,0,.45);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:20px 16px;
    }
    .top{text-align:center}
    h1{
      margin:0;
      font-size:14px;
      letter-spacing:.28em;
      text-transform:uppercase;
      font-weight:700;
    }
    .sub{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }
    .grid{
      display:grid;
      gap:24px;
      padding:40px 0 48px;
      justify-items:center;
    }
    .card{
      width:100%;
      max-width:900px;
      border:1px solid var(--border);
      background:var(--panel);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 14px;
      border-bottom:1px solid var(--border);
      background:rgba(0,0,0,.25);
    }
    .tag{
      font-size:11px;
      letter-spacing:.18em;
      color:var(--muted);
      text-transform:uppercase;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
    }
    iframe{
      width:100%;
      height:80vh;
      border:0;
      display:block;
      background:#fff;
    }
    .footer{
      padding:24px 0 12px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }
    @media (min-width:1000px){
      iframe{ height:75vh; }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Deadman</h1>
      <div class="sub">If you can read this, the switch flipped.</div>
    </div>
  </div>
</header>

<main class="wrap">
